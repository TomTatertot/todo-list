<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>To-do List</h1>
    </header>
    <div class="content">
        <nav class="left">
            
            <div class="home">
                <button>Inbox</button>
                <button>Today</button>
                <button>Upcoming</button>
            </div>
            <h1>Projects</h1>
            <div class="projects">
                <button>+ Add Project</button>
                <button>Coding Projects</button>
            </div>
        </nav>
        <div class="right">
            <h1>Today</h1>
            <div class="add-task">
                <p>+</p>
                <button class="add-task-button">Add Task</button>
            </div>
            <div class="task">
                <div class="task-main-info">
                    <label class="container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                    </label>
                    <div class="task-data">
                        <p class="task-title">Title</p>
                        <p class="task-date">8/29/25</p>
                    </div>
                </div>
                <p class="task-description">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Doloremque nostrum
                    ipsum qui hic quia eveniet ut quasi natus dolores consequuntur.</p>
            </div>

            <div class="task">
                <label class="container">
                    <input type="checkbox">
                    <span class="checkmark"></span>
                </label>
                <div class="task-data">
                    <p class="task-title">Title 2</p>
                    <p class="task-date">8/29/25</p>
                </div>
            </div>

            <div class="task">
                <label class="container">
                    <input type="checkbox">
                    <span class="checkmark"></span>
                </label>
                <div class="task-data">
                    <p class="task-title">Title 3</p>
                    <p class="task-date">8/29/25</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
